        <text x="17" y="52" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Session reserve / load</text>
        <text x="17" y="72" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Temporary Drive folder</text>
        <text x="17" y="92" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Working context</text>

