        <text x="587" y="28" fill="#fafafa" font-family="Inter, sans-serif" font-size="13" font-weight="650">Lifecycle / status</text>
        <text x="587" y="52" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Hold · pending · resume</text>
        <text x="587" y="72" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Drop · cancel · status</text>
        <text x="587" y="92" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Context support</text>
      </g>

      <path d="M375 316V336" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>

      <rect y="346" width="750" height="68" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.07"/>
      <circle cx="31" cy="380" r="14" fill="#60a5fa" fill-opacity="0.18"/><text x="26" y="385" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="700">3</text>
      <text x="58" y="374" fill="#fafafa" font-family="Inter, sans-serif" font-size="15" font-weight="650">Staged-file workflow resolves, moves, records, and finalises</text>
      <text x="58" y="397" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">Final Drive folder · provider results · document upsert · terminal session state</text>

      <path d="M375 416V436" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>

      <rect y="446" width="750" height="62" rx="16" fill="#22c55e" fill-opacity="0.06" stroke="#22c55e" stroke-opacity="0.22"/>
      <circle cx="31" cy="477" r="14" fill="#22c55e" fill-opacity="0.18"/><text x="26" y="482" fill="#86efac" font-family="Inter, sans-serif" font-size="13" font-weight="700">4</text>
      <text x="58" y="472" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="650">AI enrichment → Sheets + PostgreSQL KB → Telegram outcome</text>
      <text x="58" y="494" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">Case context · extraction · file checklist · cases/documents/events · staff next action</text>
