        <text x="207" y="72" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Status + projection SQL</text>
        <text x="207" y="92" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Failure + reconciliation</text>

        <rect x="380" width="176" height="108" rx="15" fill="#171719" stroke="#ffffff" stroke-opacity="0.07"/>
        <text x="397" y="28" fill="#fafafa" font-family="Inter, sans-serif" font-size="13" font-weight="650">File ingress</text>
        <text x="397" y="52" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Acceptance + receipt</text>
        <text x="397" y="72" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Duplicate classification</text>
        <text x="397" y="92" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Processing job</text>

