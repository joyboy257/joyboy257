  <g transform="translate(886 112)">
    <rect width="342" height="548" rx="22" fill="#111113" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="24" y="38" fill="#fafafa" font-family="Inter, sans-serif" font-size="17" font-weight="700">Evidence state</text>
    <text x="24" y="62" fill="#71717a" font-family="Inter, sans-serif" font-size="12">What can be defended today</text>

    <g transform="translate(24 88)">
      <rect width="294" height="82" rx="15" fill="#0e1510" stroke="#22c55e" stroke-opacity="0.2"/>
      <text x="17" y="26" fill="#86efac" font-family="Inter, sans-serif" font-size="11" font-weight="700">PRODUCTION CURRENT</text>
      <text x="17" y="50" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="650">Live staff adoption</text>
      <text x="17" y="69" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Main and existing sub-workflows run the path</text>

      <rect y="96" width="294" height="102" rx="15" fill="#171719" stroke="#ffffff" stroke-opacity="0.07"/>
      <text x="17" y="122" fill="#fbbf24" font-family="Inter, sans-serif" font-size="11" font-weight="700">CURRENT LIMITATION</text>
      <text x="17" y="147" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="650">Authority is distributed</text>
      <text x="17" y="168" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">n8n logic · state tables · Sheets · Drive</text>
      <text x="17" y="187" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">PostgreSQL KB is not yet sole authority</text>

      <rect y="212" width="294" height="116" rx="15" fill="#f59e0b" fill-opacity="0.06" stroke="#f59e0b" stroke-opacity="0.2"/>
      <text x="17" y="238" fill="#fbbf24" font-family="Inter, sans-serif" font-size="11" font-weight="700">TEST-VERIFIED INACTIVE</text>
      <text x="17" y="263" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="650">Summary parsing / save</text>
      <text x="17" y="285" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">PostgreSQL replay + concurrency proof</text>
      <text x="17" y="304" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Zero callers · zero executions · no cutover</text>

      <rect y="342" width="294" height="120" rx="15" fill="#171719" stroke="#ffffff" stroke-opacity="0.07"/>
      <text x="17" y="368" fill="#60a5fa" font-family="Inter, sans-serif" font-size="11" font-weight="700">NOT CLAIMED</text>
      <text x="17" y="394" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Whole-system exactly-once behaviour</text>
      <text x="17" y="416" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Full PostgreSQL production authority</text>
      <text x="17" y="438" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Audited ROI or time savings</text>
