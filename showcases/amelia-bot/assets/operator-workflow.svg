<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Amelia Bot synthetic operator workflow</title>
  <desc id="desc">A recruiter-safe reconstruction showing a staff request becoming a confirmed intake, file ingress, state update, and durable receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#14100a"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0L0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.025"/></pattern>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="720" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="718" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(52 42)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#fafafa" font-family="Inter, sans-serif" font-size="25" font-weight="700">Synthetic operator journey</text>
    <text x="0" y="38" dominant-baseline="hanging" fill="#71717a" font-family="Inter, sans-serif" font-size="15">Reconstructed with synthetic labels; no client or production data.</text>
  </g>

  <g transform="translate(52 112)">
    <rect width="770" height="548" rx="22" fill="#111113" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect width="770" height="58" rx="22" fill="#161619"/>
    <circle cx="28" cy="29" r="6" fill="#22c55e"/>
    <text x="46" y="35" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="14" font-weight="650">Amelia Bot · staff operations</text>
    <text x="650" y="35" fill="#71717a" font-family="ui-monospace, monospace" font-size="12">LIVE WORKFLOW</text>

    <g transform="translate(28 86)">
      <rect x="0" y="0" width="448" height="74" rx="16" fill="#1b1b1f" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="28" cy="24" r="12" fill="#3f3f46"/><text x="24" y="29" fill="#f4f4f5" font-family="Inter, sans-serif" font-size="12" font-weight="700">S</text>
      <text x="50" y="25" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="650">Staff operator</text>
      <text x="20" y="53" fill="#d4d4d8" font-family="Inter, sans-serif" font-size="14">“Create a new intake from this message and attachment.”</text>

      <rect x="122" y="92" width="570" height="114" rx="16" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.28"/>
      <circle cx="150" cy="117" r="12" fill="#f59e0b" fill-opacity="0.24"/><text x="146" y="122" fill="#fbbf24" font-family="Inter, sans-serif" font-size="12" font-weight="700">A</text>
      <text x="172" y="119" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="650">Amelia Bot</text>
      <text x="142" y="151" fill="#d4d4d8" font-family="Inter, sans-serif" font-size="14">I found the following candidate details:</text>
      <text x="142" y="176" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="12">type: new_intake · attachment: 1 · missing: reference</text>
      <rect x="142" y="184" width="112" height="30" rx="15" fill="#f59e0b" fill-opacity="0.18" stroke="#fbbf24" stroke-opacity="0.3"/>
      <text x="162" y="204" fill="#fef3c7" font-family="Inter, sans-serif" font-size="12" font-weight="650">Confirm draft</text>
      <rect x="264" y="184" width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="285" y="204" fill="#d4d4d8" font-family="Inter, sans-serif" font-size="12" font-weight="650">Correct</text>

      <rect x="0" y="226" width="430" height="64" rx="16" fill="#1b1b1f" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="28" cy="250" r="12" fill="#3f3f46"/><text x="24" y="255" fill="#f4f4f5" font-family="Inter, sans-serif" font-size="12" font-weight="700">S</text>
      <text x="50" y="251" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="650">Staff operator</text>
      <text x="20" y="276" fill="#d4d4d8" font-family="Inter, sans-serif" font-size="14">Confirmed. Use reference SYN-2042.</text>

      <rect x="122" y="310" width="570" height="150" rx="16" fill="#22c55e" fill-opacity="0.065" stroke="#22c55e" stroke-opacity="0.22"/>
      <circle cx="150" cy="336" r="12" fill="#22c55e" fill-opacity="0.18"/><path d="M144 336l4 4 8-9" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="172" y="339" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="650">Operation committed</text>
      <text x="142" y="370" fill="#d4d4d8" font-family="Inter, sans-serif" font-size="14">Intake created, attachment registered, and review state opened.</text>
      <g transform="translate(142 394)">
        <rect width="142" height="42" rx="11" fill="#0f1711" stroke="#22c55e" stroke-opacity="0.18"/>
        <text x="14" y="17" fill="#71717a" font-family="Inter, sans-serif" font-size="11">STATE</text><text x="14" y="33" fill="#bbf7d0" font-family="ui-monospace, monospace" font-size="12">awaiting_review</text>
        <rect x="154" width="150" height="42" rx="11" fill="#0f1711" stroke="#22c55e" stroke-opacity="0.18"/>
        <text x="168" y="17" fill="#71717a" font-family="Inter, sans-serif" font-size="11">OPERATION</text><text x="168" y="33" fill="#bbf7d0" font-family="ui-monospace, monospace" font-size="12">op_syn_2042</text>
        <rect x="316" width="150" height="42" rx="11" fill="#0f1711" stroke="#22c55e" stroke-opacity="0.18"/>
        <text x="330" y="17" fill="#71717a" font-family="Inter, sans-serif" font-size="11">EVIDENCE</text><text x="330" y="33" fill="#bbf7d0" font-family="ui-monospace, monospace" font-size="12">receipt_saved</text>
      </g>
    </g>
  </g>

  <g transform="translate(850 112)">
    <rect width="378" height="548" rx="22" fill="#111113" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="24" y="38" fill="#fafafa" font-family="Inter, sans-serif" font-size="16" font-weight="700">Authoritative state</text>
    <text x="24" y="62" fill="#71717a" font-family="Inter, sans-serif" font-size="12">Database-backed operational view</text>

    <g transform="translate(24 88)">
      <rect width="330" height="78" rx="15" fill="#171719" stroke="#ffffff" stroke-opacity="0.07"/>
      <text x="18" y="24" fill="#71717a" font-family="Inter, sans-serif" font-size="11">CURRENT STATE</text>
      <text x="18" y="51" fill="#fafafa" font-family="Inter, sans-serif" font-size="18" font-weight="700">Awaiting human review</text>
      <circle cx="300" cy="39" r="8" fill="#f59e0b"/>

      <rect y="92" width="330" height="132" rx="15" fill="#171719" stroke="#ffffff" stroke-opacity="0.07"/>
      <text x="18" y="118" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="650">Workflow evidence</text>
      <text x="18" y="146" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">✓ Intent parsed and validated</text>
      <text x="18" y="169" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">✓ Staff confirmation recorded</text>
      <text x="18" y="192" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">✓ File ingress ledger committed</text>
      <text x="18" y="215" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">✓ Outcome receipt persisted</text>

      <rect y="238" width="330" height="122" rx="15" fill="#171719" stroke="#ffffff" stroke-opacity="0.07"/>
      <text x="18" y="264" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="650">Safety boundary</text>
      <rect x="18" y="282" width="294" height="30" rx="9" fill="#f59e0b" fill-opacity="0.08"/>
      <text x="30" y="302" fill="#fde68a" font-family="Inter, sans-serif" font-size="12">Human authority required before next write</text>
      <text x="18" y="340" fill="#71717a" font-family="Inter, sans-serif" font-size="11">The LLM cannot promote this state.</text>

      <rect y="374" width="330" height="92" rx="15" fill="#0e1510" stroke="#22c55e" stroke-opacity="0.18"/>
      <text x="18" y="400" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="650">Idempotency</text>
      <text x="18" y="425" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">Same key + same payload → replay</text>
      <text x="18" y="448" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">Same key + new payload → conflict</text>
    </g>
  </g>
</svg>