<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Amelia Bot sanitised production workflow</title>
  <desc id="desc">A recruiter-safe reconstruction of the current Telegram, n8n, Google Drive, enrichment, Sheets and PostgreSQL KB path, with explicit hardening status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a0c"/><stop offset="1" stop-color="#14100a"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0L0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.025"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71717a"/></marker>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="720" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="718" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(52 42)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#fafafa" font-family="Inter, sans-serif" font-size="25" font-weight="700">Current production path</text>
    <text x="0" y="38" dominant-baseline="hanging" fill="#71717a" font-family="Inter, sans-serif" font-size="15">Sanitised reconstruction; reflects verified workflow roles, not a production screenshot.</text>
  </g>

  <g transform="translate(52 112)">
    <rect width="806" height="548" rx="22" fill="#111113" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect width="806" height="58" rx="22" fill="#161619"/>
    <circle cx="28" cy="29" r="6" fill="#22c55e"/>
    <text x="46" y="35" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="14" font-weight="650">Amelia Bot · staff operations</text>
    <text x="646" y="35" fill="#71717a" font-family="ui-monospace, monospace" font-size="12">STAFF-USED PRODUCTION</text>

    <g transform="translate(28 86)">
      <rect width="750" height="68" rx="16" fill="#1b1b1f" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle cx="31" cy="34" r="14" fill="#3f3f46"/><text x="26" y="39" fill="#f4f4f5" font-family="Inter, sans-serif" font-size="13" font-weight="700">1</text>
      <text x="58" y="29" fill="#fafafa" font-family="Inter, sans-serif" font-size="15" font-weight="650">Staff sends Telegram command, intake details, or files</text>
      <text x="58" y="51" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">Free-form message, lifecycle command, status request, or attachment</text>

