      <rect y="100" width="750" height="72" rx="16" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.28"/>
      <circle cx="31" cy="136" r="14" fill="#f59e0b" fill-opacity="0.22"/><text x="26" y="141" fill="#fbbf24" font-family="Inter, sans-serif" font-size="13" font-weight="700">2</text>
      <text x="58" y="130" fill="#fafafa" font-family="Inter, sans-serif" font-size="15" font-weight="650">Main intake parses and routes the update</text>
      <text x="58" y="153" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="12">Aliases · command policy · summary interpretation · file normalisation</text>
      <rect x="604" y="119" width="124" height="34" rx="17" fill="#f59e0b" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.3"/>
