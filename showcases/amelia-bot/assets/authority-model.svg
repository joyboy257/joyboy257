<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Amelia Bot authority model</title>
  <desc id="desc">A dark recruiter-safe system diagram separating LLM interpretation, deterministic rules, PostgreSQL authority, human review, and external effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090a0c"/><stop offset="1" stop-color="#12100c"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71717a"/></marker>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0L0 0 0 34" fill="none" stroke="#ffffff" stroke-opacity="0.025"/></pattern>
  </defs>
  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="558" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="56" y="62" fill="#fafafa" font-family="Inter, sans-serif" font-size="27" font-weight="700">Authority is explicit at every boundary</text>
  <text x="56" y="91" fill="#71717a" font-family="Inter, sans-serif" font-size="14">Probabilistic interpretation is useful. It is never the final write authority.</text>

  <g transform="translate(56 138)">
    <rect width="210" height="160" rx="20" fill="#151519" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="34" cy="36" r="15" fill="#60a5fa" fill-opacity="0.16"/><text x="29" y="42" fill="#93c5fd" font-family="Inter, sans-serif" font-size="15" font-weight="700">1</text>
    <text x="58" y="41" fill="#fafafa" font-family="Inter, sans-serif" font-size="16" font-weight="700">Source intent</text>
    <text x="20" y="78" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Staff messages</text>
    <text x="20" y="101" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Email and attachments</text>
    <text x="20" y="124" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Provider events</text>
    <rect x="20" y="137" width="170" height="4" rx="2" fill="#60a5fa" fill-opacity="0.5"/>

    <path d="M220 80H270" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="280" width="210" height="160" rx="20" fill="#17140f" stroke="#f59e0b" stroke-opacity="0.24"/>
    <circle cx="314" cy="36" r="15" fill="#f59e0b" fill-opacity="0.18"/><text x="309" y="42" fill="#fbbf24" font-family="Inter, sans-serif" font-size="15" font-weight="700">2</text>
    <text x="338" y="41" fill="#fafafa" font-family="Inter, sans-serif" font-size="16" font-weight="700">LLM interpretation</text>
    <text x="300" y="78" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Intent classification</text>
    <text x="300" y="101" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Candidate fields</text>
    <text x="300" y="124" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Draft summaries</text>
    <text x="300" y="146" fill="#fde68a" font-family="Inter, sans-serif" font-size="11" font-weight="650">PROPOSES ONLY</text>

    <path d="M500 80H550" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="560" width="210" height="160" rx="20" fill="#141416" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="594" cy="36" r="15" fill="#a78bfa" fill-opacity="0.16"/><text x="589" y="42" fill="#c4b5fd" font-family="Inter, sans-serif" font-size="15" font-weight="700">3</text>
    <text x="618" y="41" fill="#fafafa" font-family="Inter, sans-serif" font-size="16" font-weight="700">Deterministic rules</text>
    <text x="580" y="78" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Identity and state</text>
    <text x="580" y="101" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Schema and file policy</text>
    <text x="580" y="124" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Permissions and retries</text>
    <text x="580" y="146" fill="#c4b5fd" font-family="Inter, sans-serif" font-size="11" font-weight="650">VALIDATES</text>

    <path d="M780 80H830" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="840" width="210" height="160" rx="20" fill="#0f1711" stroke="#22c55e" stroke-opacity="0.22"/>
    <circle cx="874" cy="36" r="15" fill="#22c55e" fill-opacity="0.16"/><text x="869" y="42" fill="#86efac" font-family="Inter, sans-serif" font-size="15" font-weight="700">4</text>
    <text x="898" y="41" fill="#fafafa" font-family="Inter, sans-serif" font-size="16" font-weight="700">PostgreSQL authority</text>
    <text x="860" y="78" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Transactions and ledgers</text>
    <text x="860" y="101" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Idempotency and conflicts</text>
    <text x="860" y="124" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Canonical outcome evidence</text>
    <text x="860" y="146" fill="#86efac" font-family="Inter, sans-serif" font-size="11" font-weight="650">COMMITS</text>

    <path d="M1060 80H1110" stroke="#71717a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1120" width="104" height="160" rx="20" fill="#151519" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="1153" cy="36" r="15" fill="#ffffff" fill-opacity="0.06"/><text x="1148" y="42" fill="#d4d4d8" font-family="Inter, sans-serif" font-size="15" font-weight="700">5</text>
    <text x="1138" y="76" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="700">External</text>
    <text x="1138" y="98" fill="#fafafa" font-family="Inter, sans-serif" font-size="14" font-weight="700">effect</text>
    <text x="1138" y="128" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Email</text>
    <text x="1138" y="145" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="11">Drive</text>
  </g>

  <g transform="translate(336 344)">
    <rect width="608" height="150" rx="22" fill="#111113" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle cx="36" cy="38" r="15" fill="#f59e0b" fill-opacity="0.18"/><path d="M36 27v14M36 47v2" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <text x="62" y="43" fill="#fafafa" font-family="Inter, sans-serif" font-size="17" font-weight="700">Human authority interrupts the path when proof is insufficient</text>
    <g transform="translate(24 72)">
      <rect width="128" height="44" rx="12" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/><text x="17" y="27" fill="#d4d4d8" font-family="Inter, sans-serif" font-size="12">Ambiguous match</text>
      <rect x="140" width="134" height="44" rx="12" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/><text x="158" y="27" fill="#d4d4d8" font-family="Inter, sans-serif" font-size="12">Missing context</text>
      <rect x="286" width="142" height="44" rx="12" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/><text x="303" y="27" fill="#d4d4d8" font-family="Inter, sans-serif" font-size="12">Uncertain effect</text>
      <rect x="440" width="144" height="44" rx="12" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.2"/><text x="457" y="27" fill="#fde68a" font-family="Inter, sans-serif" font-size="12">Consequential write</text>
    </g>
  </g>
</svg>