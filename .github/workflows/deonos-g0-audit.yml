name: DeonOS G0 baseline audit (read-only)
run-name: EX-001/EX-002 screenshots, links and Lighthouse
on:
  push:
    branches:
      - audit/deonos-g0-2026-10-27
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser and Lighthouse
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm install --no-save --no-audit --no-fund lighthouse@12.8.2
      - name: Compare production assets against pinned repository
        id: identity
        continue-on-error: true
        run: python portfolio/g0-audit/VERIFY_DEPLOYED_ASSETS.py
      - name: Capture live browser screenshots, routes, gestures, network and Lighthouse
        id: capture
        continue-on-error: true
        run: |
          export CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python portfolio/g0-audit/EX002_CAPTURE.py \
            --url https://deon-desktop-portfolio.vercel.app/ \
            --output ex002-evidence \
            --lighthouse
      - name: Publish audit files even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deonos-g0-ex002-${{ github.run_id }}
          path: ex002-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Declare only observed evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('ex002-evidence')
          print('G0 audit outputs:', [p.name for p in out.glob('*')])
          r=out/'EX002_RUNTIME_RESULTS.json'
          if r.exists():
              data=json.loads(r.read_text())
              print('Interaction results:',data.get('summary'))
              print('Lighthouse scores:',data.get('lighthouse_median'))
          else:
              print('No browser evidence: runner blocked or capture failed')
          p=Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
          with p.open('a') as f:
              f.write('## DeonOS G0 evidence\n')
              f.write('Only read-only checks against existing production. **Physical Safari is not tested.**\n')
              f.write('Pinned source before G0 audit: `a63e3d3273e701a323a6e8772ce754421520f17b`.\n')
              f.write('Download the run artifact to inspect PNG/JSON before gate sign-off.\n')
          PY
