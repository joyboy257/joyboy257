name: DeonOS EX-008 wallpaper source and quality probe
on:
  push:
    branches: [programme/deonos-g1-foundation-2026-10-27]
    paths: [.github/workflows/deonos-ex008-probe.yml]
permissions:
  contents: read
jobs:
  photo-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Probe exact lock-image URL, dimensions and compression
        run: |
          python - <<'PY'
          import io, json, hashlib, urllib.request
          from pathlib import Path
          from PIL import Image, ImageStat, ImageChops, ImageOps
          u='https://images.unsplash.com/photo-1687575635446-092e15df323e?auto=format&fit=crop&w=2200&q=84'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 DeonOS photo optimization read-only','Accept':'image/jpeg'})
          with urllib.request.urlopen(req,timeout=35) as response:
              raw=response.read()
              ctype=response.headers.get('Content-Type')
          source=Image.open(io.BytesIO(raw)).convert('RGB')
          Path('ex008-probe').mkdir(exist_ok=True)
          Path('ex008-probe/source-sample.jpg').write_bytes(raw)
          report={'url':u,'source_sha256':hashlib.sha256(raw).hexdigest(),'source_bytes':len(raw),'content_type':ctype,'pixels':source.size,'options':[]}
          for label,width,budget in [('desktop',1900,180000),('mobile',1000,130000)]:
              frame=source.copy()
              frame.thumbnail((width,9999),Image.Resampling.LANCZOS)
              for quality in (76,70,65,60,55,50,45,40):
                  out=io.BytesIO();frame.save(out,format='WEBP',quality=quality,method=6,exact=True)
                  result={'variant':label,'width':frame.width,'height':frame.height,'quality':quality,'bytes':len(out.getvalue())}
                  report['options'].append(result)
                  if result['bytes']<=budget:
                      Path('ex008-probe/'+label+'.webp').write_bytes(out.getvalue())
                      break
          Path('ex008-probe/report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='options'}))
          print('Options:',json.dumps(report['options']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deonos-ex008-probe-${{ github.run_id }}
          path: ex008-probe/
          retention-days: 7
