name: DeonOS Featured Work — visual and performance QA
on:
  push:
    branches: [feature/deonos-featured-work-001]
    paths:
      - portfolio/desktop-v8/**
      - .github/workflows/deonos-featured-work.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  featured-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    defaults:
      run:
        working-directory: portfolio/desktop-v8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Static source, 21-project claims, build and tests
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test
      - name: Enforce initial bundle-size budget
        run: |
          mkdir -p ../../featured-evidence
          python - <<'PY'
          from pathlib import Path
          import gzip,json
          root=Path('dist')
          index=root/'index.html'
          js=list((root/'assets').glob('*.js'))
          # The independent resume page is not part of the OS lock-screen.
          css=list((root/'assets').glob('*.css'))
          main_css=[f for f in css if 'lock-mobile' in f.read_text()]
          assert len(main_css)==1
          items=[index,*js,*main_css]
          size=sum(len(gzip.compress(f.read_bytes(),9)) for f in items)
          report={'initial_html_js_css_gzip_bytes':size,'maximum':100000,'pass':size<=100000}
          Path('../../featured-evidence/BUNDLE_BUDGET.json').write_text(json.dumps(report,indent=2))
          print(report)
          assert report['pass']
          PY
      - name: Install browser engines and Lighthouse
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
          npm install --no-save --no-audit --no-fund lighthouse@12.8.2
      - name: Start local preview
        run: |
          npm run preview -- --port 4173 > /tmp/deonos-featured-preview.log 2>&1 &
          python - <<'PY'
          import urllib.request,time
          for i in range(30):
              try:
                  assert urllib.request.urlopen('http://127.0.0.1:4173/',timeout=2).status == 200
                  break
              except Exception:time.sleep(.5)
          else:raise SystemExit('Preview did not start')
          PY
      - name: Test all four rendered layouts and image outages
        run: python scripts/featured-e2e.py
      - name: Verify original résumé and OS workflows remain
        run: |
          python scripts/recruiter-e2e.py
          python scripts/route-e2e.py
          python scripts/window-keyboard-e2e.py
          python scripts/media-fallback-e2e.py
          python scripts/check-asset-budget.py
      - name: Lighthouse and first-screen browser parity
        run: |
          export CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python ../../portfolio/g0-audit/EX002_CAPTURE.py --url http://127.0.0.1:4173/ --output ../../featured-evidence/parity --lighthouse
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('../../featured-evidence/parity/EX002_RUNTIME_RESULTS.json').read_text())
          assert j['summary']['fail']==0 and j['summary']['fatal_errors']==0,j['summary']
          assert j['summary']['pass']==28,j['summary']
          for key,target in [('mobile',90),('desktop',95)]:
              score=j['lighthouse_median'].get(key)
              assert score is not None and score>=target,(key,score)
          print('Lighthouse medians:',j['lighthouse_median'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deonos-featured-work-${{ github.run_id }}
          path: |
            featured-evidence/
            recruiter-evidence/
            g1-evidence/
          retention-days: 30
          if-no-files-found: warn
