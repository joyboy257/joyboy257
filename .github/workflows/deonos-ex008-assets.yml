name: DeonOS EX-008 one-time responsive lock wallpaper
on:
  push:
    branches: [programme/deonos-g1-foundation-2026-10-27]
    paths: [.github/workflows/deonos-ex008-assets.yml]
permissions:
  contents: write
jobs:
  create-wallpaper:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Produce the same photograph as two responsive local WebP files
        run: |
          python - <<'PY'
          import io, hashlib, json, urllib.request
          from pathlib import Path
          from PIL import Image
          url='https://images.unsplash.com/photo-1687575635446-092e15df323e?auto=format&fit=crop&w=2200&q=84'
          req=urllib.request.Request(url,headers={
              'User-Agent':'Mozilla/5.0 DeonOS photo optimization read-only',
              'Accept':'image/jpeg'})
          with urllib.request.urlopen(req,timeout=35) as response: data=response.read()
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='fb1b9dd62e46d8510f48a67311fc2aa69ed1677f4fda7333e4b66fe4e0b62799', 'unexpected source photograph bytes'
          source=Image.open(io.BytesIO(data)).convert('RGB')
          assert source.size==(2200,1467),'unexpected dimensions'
          root=Path('portfolio/desktop-v8/assets/wallpapers')
          root.mkdir(parents=True,exist_ok=True)
          results={}
          for name,width,quality,maximum in [('lock-desktop',1900,80,180000),('lock-mobile',1700,78,130000)]:
              im=source.copy()
              im.thumbnail((width,3000),Image.Resampling.LANCZOS)
              target=root/(name+'.webp')
              im.save(target,format='WEBP',quality=quality,method=6,exact=True)
              size=target.stat().st_size
              assert size<=maximum,(name,size,maximum)
              results[name]={'bytes':size,'dimensions':im.size,'quality':quality,'sha256':hashlib.sha256(target.read_bytes()).hexdigest()}
          path=Path('portfolio/desktop-v8/style.css')
          css=path.read_text()
          original='url("https://images.unsplash.com/photo-1687575635446-092e15df323e?auto=format&fit=crop&w=2200&q=84")'
          assert css.count(original)==1,'expected one active remote lock photo'
          css=css.replace(original,'url("./assets/wallpapers/lock-desktop.webp")')
          old=' .lock-screen .lock-art{background-position:12% 48%}'
          new=' .lock-screen .lock-art{background-position:12% 48%;background-image:linear-gradient(180deg,rgba(0,0,0,.64),rgba(0,0,0,.23) 34%,rgba(0,0,0,.31) 65%,rgba(0,0,0,.56)),url("./assets/wallpapers/lock-mobile.webp")}'
          assert css.count(old)==1,'missing mobile lock selector'
          css=css.replace(old,new)
          scenic='url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2400&q=84")'
          assert css.count(scenic)==3,'unexpected legacy scenic image references'
          # These three older rules are overridden by later Big Sur declarations.
          # Remove their unused network dependency without changing their effective appearance.
          css=css.replace(scenic,'url("./bigsur-wallpaper.svg")')
          path.write_text(css)
          receipt={'source_url':url,'source_sha256':digest,'source_pixels':source.size,
                   'rights':'Unsplash License: https://unsplash.com/license; exact photographer page still needs cross-check',
                   'existing_credit':'Jackie Alexander / Unsplash (preserved, not independently authenticated)',
                   'variants':results}
          (root/'SOURCE_AND_SIZE.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - name: Save only the optimized images and CSS to the isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/desktop-v8/style.css portfolio/desktop-v8/assets/wallpapers/
          git diff --cached --stat
          git commit -m "perf(deonos): replace oversized remote lock photo with responsive local WebP"
          git push origin HEAD:refs/heads/programme/deonos-g1-foundation-2026-10-27
